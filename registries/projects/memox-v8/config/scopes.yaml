version: 1
metadata:
  id: memox-v8-ruleset-scopes
  name: MemoX V8 Ruleset Scopes
  description: >-
    Scopes for the memox-v8 repo layout, which is feature-first and differs from
    every earlier MemoX ruleset. Product code lives in lib/features/<feature>/
    {domain,data,presentation}; cross-cutting code in lib/core and lib/shared;
    the app shell in lib/app. Generated code (*.g.dart, *.freezed.dart,
    *.drift.dart, l10n output) is excluded everywhere — it is not hand-written
    and linting it produces noise nobody can act on. The vendored guard itself
    (code-verification-guard-v2/**) is excluded from every scope: it is Python
    tooling, not app source. Cross-feature import direction (feature A must not
    import feature B) cannot be expressed as a per-file regex; that check is
    owned by .claude/skills/flutter-architecture/scripts/check_architecture.sh.
scopes:
  # ---- Shared-scope remaps (names required by common / dart / flutter sets) ----
  project_files:
    include:
      - pubspec.yaml
      - analysis_options.yaml
      - .fvmrc
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  all_text_files:
    include:
      - pubspec.yaml
      - analysis_options.yaml
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  text_source_files:
    include:
      - pubspec.yaml
      - analysis_options.yaml
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  source_files:
    include:
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  source_and_config_files:
    include:
      - pubspec.yaml
      - analysis_options.yaml
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  dart_source:
    include:
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  dart_lib:
    include:
      - lib/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  flutter_source:
    include:
      - lib/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  flutter_app_source:
    include:
      - lib/**/*.dart
    exclude:
      - lib/core/theme/**
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**

  # ---- memox-v8 layer scopes ----
  # Layer boundaries per ADR-010 and ADR-011. These three are the load-bearing
  # scopes: most architecture rules are just "this pattern, in this layer".
  domain_files:
    include:
      - lib/features/*/domain/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
  data_files:
    include:
      - lib/features/*/data/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
  presentation_files:
    include:
      - lib/features/*/presentation/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Business layers that must NOT branch on StudyMode. Dispatch belongs to one
  # exhaustive switch beside the enum, in `study_mode.dart`; a handler
  # owns its own mode, so it never needs to ask. presentation/ is deliberately
  # absent: mapping a mode to a label or an icon is presentation, not policy, and
  # forbidding it there would push that mapping somewhere worse.
  #
  # `**/*_mode.dart` is the one exemption: `study_mode.dart` holds the dispatch,
  # and each other `*_mode.dart` is a mode's own handler.
  study_mode_non_dispatch:
    include:
      - lib/features/*/domain/**/*.dart
      - lib/features/*/data/**/*.dart
    exclude:
      - '**/*_mode.dart'
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'

  # Everything that is NOT allowed to open a transaction or touch a DAO.
  non_data_layer_source:
    include:
      - lib/app/**/*.dart
      - lib/shared/**/*.dart
      - lib/features/*/domain/**/*.dart
      - lib/features/*/presentation/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Widgets and screens — the surfaces that must not reach past their layer.
  widget_ui_files:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/widgets/**/*.dart
    exclude:
      - '**/*_controller.dart'
      - '**/*_state.dart'
      # `presentation/providers/`: a file whose whole job is dependency wiring
      # reads a repository *by definition*
      # and hands it to a use case that the widgets then reach through a
      # controller. Excluding it keeps `widget_no_repository_access` pointed at
      # the thing it is for: a widget skipping its controller.
      - '**/*_provider.dart'
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Product UI only. lib/app/** is deliberately OUT: it is the composition root
  # and the debug-only widget gallery, not product UI; and lib/core/theme/** is
  # where raw values are legitimately defined.
  ui_surfaces:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Where user copy is written: product UI plus the app shell and the debug
  # gallery (FE-C7). Only the literal-string rule reads it; the colour and
  # radius rules keep `ui_surfaces`.
  ui_copy_surfaces:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/**/*.dart
      - lib/app/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Product UI *plus* the theme, for the rules where "where tokens are defined"
  # is not an exemption but the very place the regression happens.
  #
  # `ui_surfaces` excludes `lib/core/theme/**` because a raw colour or radius
  # there IS the token — linting it would be flagging the definition as the
  # crime. A duration is not like that. `AppDurations` declares every duration
  # as a *named* constant, and so does every legitimate non-motion duration in
  # the repo, so the theme directory has nothing that needs the exemption — and
  # a component theme is exactly where an anonymous `Duration(milliseconds: …)`
  # hides. A rule scoped to `ui_surfaces` alone could not see it there.
  ui_and_theme_surfaces:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/**/*.dart
      - lib/core/theme/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # **Typography only, plus `lib/app/`.** The composition root and the
  # debug-only gallery set text too (`placeholder_screen.dart`, the gallery's
  # sections), and a text style there comes from the theme like anywhere else;
  # these two scopes are what keep it so. Colour is *not* widened: `lib/app/`
  # is not product UI, and the colour rules keep their scopes.
  typography_ui_surfaces:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/**/*.dart
      - lib/app/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  typography_and_theme_surfaces:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/**/*.dart
      - lib/core/theme/**/*.dart
      - lib/app/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Riverpod-owned files: controllers, notifiers and generated-provider sources.
  # The theme alone — where `ColorScheme` is constructed and the one place a
  # retired role could be handed a value. Product UI never builds a scheme, so
  # a rule about the scheme's argument list has nothing to say outside here.
  theme_files:
    include:
      - lib/core/theme/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  provider_files:
    include:
      - lib/**/*_controller.dart
      - lib/**/*_provider.dart
      - lib/**/providers/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  controller_files:
    include:
      - lib/**/*_controller.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  database_files:
    include:
      - lib/core/database/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.drift.dart'

  drift_sql_files:
    include:
      - lib/**/*.drift
    exclude: []

  # ADR-020: where a query may not be written outside `.drift`. The excludes are
  # the ADR's exceptions (D7) and nothing else: every other file of lib/ moved
  # its queries to `.drift` (spec 2026-10-01-drift-queries-only-design.md §4,
  # P0–P8). Never add a file here.
  drift_query_sites:
    include:
      - lib/**/*.dart
    exclude:
      - '**/*.g.dart'
      - lib/core/database/schema_versions.dart
      - lib/core/database/migrations/**
      - lib/core/database/app_database.dart
      - lib/core/database/local_data_reset.dart

  test_files:
    include:
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  pubspec_manifest:
    include:
      - pubspec.yaml
    exclude: []
